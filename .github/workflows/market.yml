name: market data

on:
  schedule:
    # ทุก 10 นาที ช่วง 08:00-17:59 เวลาไทย (01-10 UTC) วันจันทร์-ศุกร์ และวันละครั้งตอน 20:00 เวลาไทย
    - cron: "*/10 1-10 * * 1-5"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect market data
        run: node server/collect.mjs /tmp/market.json
      - name: Publish to market-data branch
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          git init -q -b market-data
          cp /tmp/market.json market.json
          git add market.json
          git -c user.name="market-bot" -c user.email="actions@github.com" commit -q -m "market data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" market-data
