name: radar probe (dev)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch board drawings
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p out && cd out
          for f in ES3C28P_Size.pdf ES3C28P_ES3N28P_Specification_V1.0.pdf; do
            curl -sfL -A "Mozilla/5.0" -o "$f" "https://www.lcdwiki.com/res/ES3C28P/$f" && pdftoppm -r 200 -png "$f" "${f%.pdf}" && pdftotext -layout "$f" "${f%.pdf}.txt"
          done
          ls -la
      - name: Publish to probe-out branch
        run: |
          cd out && rm -f *.pdf && git init -q -b probe-out && git add . && git -c user.name=bot -c user.email=actions@github.com commit -q -m probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
