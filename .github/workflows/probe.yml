name: storm probe 2 (dev)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe satellite and storm tracks
        run: |
          mkdir -p out && cd out
          UA="esp32-weather-s3/1.6 (+https://github.com/wssnuk/esp32-weather)"
          for L in Himawari_AHI_Band13_Clean_Infrared Himawari_AHI_Band3_Red_Visible_1km; do
            for M in GoogleMapsCompatible_Level6 GoogleMapsCompatible_Level7 GoogleMapsCompatible_Level8; do
              u="https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/$L/default/default/$M/4/7/12.png"
              c=$(curl -s -A "$UA" -o "${L}_${M}.png" -w "%{http_code} %{content_type} %{size_download}" "$u"); echo "GIBS $L $M -> $c"
            done
          done
          curl -s -A "$UA" "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/wmts.cgi?SERVICE=WMTS&REQUEST=GetCapabilities" -o caps.xml
          python3 - <<'PY'
          import re
          x = open('caps.xml').read()
          for m in re.finditer(r'<ows:Identifier>(Himawari[^<]*)</ows:Identifier>', x):
              i = m.start(); seg = x[i:i+3000]
              tm = re.search(r'<TileMatrixSet>([^<]*)</TileMatrixSet>', seg); fmt = re.search(r'<Format>([^<]*)</Format>', seg)
              dflt = re.search(r'<Default>([^<]*)</Default>', seg)
              print('LAYER', m.group(1), tm and tm.group(1), fmt and fmt.group(1), 'default', dflt and dflt.group(1))
          PY
          curl -s -A "$UA" "https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=TC&eventid=1001348&episodeid=9" -o geom.json; head -c 1200 geom.json; echo
          ls -la
          git init -q -b probe-out && git add . && git -c user.name=bot -c user.email=actions@github.com commit -q -m probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
